# The control plane: the tenant registry in its own PostgreSQL, the platform API, the lifecycle
# worker, and the promoter (Phase 4). Its own namespace and Argo CD Application, so it syncs and fails apart from every cell.
# Overlays set the namespace, the cell it manages, and the image digests. The dev overlay carries
# its Secrets sealed (Phase 7).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
labels:
  - pairs:
      app.kubernetes.io/part-of: shop-platform
resources:
  - platform-db.yaml
  - db-migrate.yaml
  - platform-api.yaml
  - platform-worker.yaml
  - platform-promoter.yaml
  - podmonitors.yaml
