# Which paths make which unit "affected". What goes into every image (contracts, service-kit, the
# lockfile, the build config) is `shared`: CI tests and the release rebuilds every service. What only
# CI and the tests use (the Compose stack, the Makefile, scripts, CI config) is `ci-shared`: CI tests
# every service, but the release rebuilds nothing for it, since no image holds it (Phase 7: two
# merges of scripts and manifests rebuilt and rolled out all seven images in every cell).
shared:
  - "packages/**"
  - "package.json"
  - "pnpm-lock.yaml"
  - "pnpm-workspace.yaml"
  - "turbo.json"
  - "tsconfig.base.json"
  - ".dockerignore"
ci-shared:
  - "biome.jsonc"
  - "compose.yaml"
  - "compose.*.yaml"
  - "Makefile"
  - "scripts/**"
  - ".github/**"
catalog-cart-api:
  - "apps/catalog-cart-api/**"
  - "db/catalog/**"
  - "db/seed/**"
  - "db/roles.sh"
order-service:
  - "apps/order-service/**"
  - "db/orders/**"
  - "db/roles.sh"
worker:
  - "apps/worker/**"
  - "db/orders/**"
storefront:
  - "apps/storefront/**"
router:
  - "apps/router/**"
platform:
  - "apps/platform/**"
  - "db/platform/**"
db-migrations:
  - "apps/db-migrations/**"
  - "db/**"
deploy:
  - "deploy/**"
tests:
  - "tests/**"
