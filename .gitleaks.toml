# Gitleaks (pre-commit and CI): the default rules, and one allowance.
[extend]
useDefault = true

# SealedSecret ciphertext (Phase 7): each value is encrypted to the cluster's Sealed Secrets
# controller (`scripts/seal-secrets.py`) and only its private key decrypts it. Allowed only where
# both hold, in a sealed-*.yaml file under deploy/ and on a line that is one key's ciphertext
# (kubeseal's output starts "Ag" and runs to hundreds of base64 characters): a real secret pasted
# into such a file, in any other shape, is still caught.
[[allowlists]]
description = "SealedSecret ciphertext"
condition = "AND"
paths = ['''^deploy/.+/sealed-[a-z0-9-]+\.yaml$''']
regexTarget = "line"
regexes = ['''^\s+[A-Za-z0-9_.-]+: Ag[A-Za-z0-9+/=]{300,}$''']
