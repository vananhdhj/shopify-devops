# Everything an environment runs. Overlays set the namespace, environment values, and the
# exact image digests. Each dev cell's Secret is sealed beside its overlay (Phase 7).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
labels:
  - pairs:
      app.kubernetes.io/part-of: shop
resources:
  - data/postgres.yaml
  - data/redis.yaml
  - jobs/db-migrate.yaml
  - jobs/register-cell.yaml
  - apps/catalog-cart-api.yaml
  - apps/order-service.yaml
  - apps/worker.yaml
  - apps/storefront.yaml
  - observability/podmonitors.yaml
  - observability/alerts.yaml
# The dashboards live with the monitoring stack, one copy for the fleet (deploy/monitoring/config):
# a copy per cell would only overwrite each other in Grafana.
