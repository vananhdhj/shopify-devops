# The database step of each release: roles and both schemas' migrations, as a Sync hook in wave -1.
# Argo CD finishes wave -2 (PostgreSQL, Redis, this ServiceAccount) before it, and it before wave 0
# (the cell's units), so it must succeed before any new application pod is synced; migrations are
# backward-compatible, so the old pods keep working against the new schema meanwhile. Not a PreSync
# hook: on a fresh namespace a PreSync hook runs before anything else exists, so neither its
# ServiceAccount nor the database would be there (the control plane's first sync hung exactly so).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: db-migrate
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
automountServiceAccountToken: false
---
apiVersion: batch/v1
kind: Job
metadata:
  name: db-migrate
  annotations:
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/sync-wave: "-1"
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: 6
  activeDeadlineSeconds: 600
  template:
    spec:
      serviceAccountName: db-migrate
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 70 # postgres in the image
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: db-migrate
          image: ghcr.io/vananhdhj/shopify-devops/db-migrations
          command: ["migrate.sh"]
          env:
            - name: PGHOST
              value: postgres
            - name: DB_SUPERUSER_PASSWORD
              valueFrom: { secretKeyRef: { name: shop-secrets, key: DB_SUPERUSER_PASSWORD } }
            - name: DB_MIGRATOR_PASSWORD
              valueFrom: { secretKeyRef: { name: shop-secrets, key: DB_MIGRATOR_PASSWORD } }
            - name: DB_CATALOG_PASSWORD
              valueFrom: { secretKeyRef: { name: shop-secrets, key: DB_CATALOG_PASSWORD } }
            - name: DB_ORDER_PASSWORD
              valueFrom: { secretKeyRef: { name: shop-secrets, key: DB_ORDER_PASSWORD } }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { memory: 128Mi }
