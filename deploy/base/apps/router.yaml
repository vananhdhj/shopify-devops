# Router: the cell's edge and its only unit on the ingress. Maps <handle>.<base domain> to a tenant
# from the static tenant table and proxies to the storefront with a signed tenant context (ADR-0011).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: router
automountServiceAccountToken: false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: router
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: router
  template:
    metadata:
      labels:
        app.kubernetes.io/name: router
    spec:
      serviceAccountName: router
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000 # node in the image; numeric so the kubelet can verify non-root
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: router
          image: ghcr.io/vananhdhj/shopify-devops/router
          env:
            - name: STOREFRONT_URL
              value: http://storefront:3000
            - name: TENANTS_FILE
              value: /config/tenants.json
            - name: TENANT_CONTEXT_SECRET
              valueFrom: { secretKeyRef: { name: shop-secrets, key: TENANT_CONTEXT_SECRET } }
          envFrom:
            - configMapRef:
                name: shop-env # generated per environment by the overlay (TENANT_BASE_DOMAIN)
          ports:
            - name: http
              containerPort: 8000
            - name: ops # private: health and metrics, not behind the Service or the ingress
              containerPort: 8001
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          startupProbe:
            httpGet: { path: /health/live, port: ops }
            periodSeconds: 2
            failureThreshold: 30
          livenessProbe:
            httpGet: { path: /health/live, port: ops }
            periodSeconds: 10
          readinessProbe:
            httpGet: { path: /health/ready, port: ops }
            periodSeconds: 5
          resources:
            requests: { cpu: 25m, memory: 64Mi }
            limits: { memory: 192Mi }
          volumeMounts:
            - name: tenants
              mountPath: /config
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tenants
          configMap:
            name: shop-tenants
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: router
spec:
  selector:
    app.kubernetes.io/name: router
  ports:
    - name: http
      port: 8000
      targetPort: http
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: router
spec:
  ingressClassName: traefik
  rules:
    - host: "*.shop.example" # every shop of the environment; set by each overlay
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: router
                port:
                  name: http
