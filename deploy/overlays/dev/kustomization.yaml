# The dev environment on the laptop's k3d cluster. CI rewrites the `digest:` lines below after
# each release build (ADR-0003); everything else changes only through pull requests.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: shop-dev
resources:
  - ../../base
  - seed-job.yaml
configMapGenerator:
  - name: shop-env
    literals:
      - APP_ENV=dev
      - COOKIE_SECURE=false # plain http on the lab ingress
patches:
  - target: {kind: Ingress, name: storefront}
    patch: |-
      - op: replace
        path: /spec/rules/0/host
        value: shop.localhost
images:
  - name: ghcr.io/vananhdhj/shopify-devops/catalog-cart-api
    digest: sha256:e46a93f1eca2919c78a178505c130252e9ded89cfb0d1f545c5522f7e7a9e5df
  - name: ghcr.io/vananhdhj/shopify-devops/order-service
    digest: sha256:9702d1f42842a98ff950b0bfe9f611a463c2a90f8f0196f6b3db3e619e4b3e17
  - name: ghcr.io/vananhdhj/shopify-devops/worker
    digest: sha256:031cc3953b82af23d02949a564a746d14e5ba9140518e2b440fb3eb9a0756671
  - name: ghcr.io/vananhdhj/shopify-devops/storefront
