# The dev environment, deployed by Argo CD from main. Automated sync applies every commit to
# deploy/overlays/dev (prune removes deleted objects; self-heal reverts hand edits), so the only
# ways to change what runs are a reviewed pull request or CI's digest bump (ADR-0003).
# Rollback = revert the commit in Git; never `kubectl rollout undo`, which Argo would overwrite.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: shop-dev
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/vananhdhj/shopify-devops.git
    targetRevision: main
    path: deploy/overlays/dev
  destination:
    server: https://kubernetes.default.svc
    namespace: shop-dev # created, with its Secret, by `make secrets`
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      # Prune only after every other resource of the sync is healthy: a resource the old pods still
      # use (the router's tenant ConfigMap, in the Phase 2 outage) outlives the rollout that drops it.
      - PruneLast=true
    retry:
      limit: 10
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 5m
