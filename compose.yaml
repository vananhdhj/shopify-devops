name: shopify-devops

# Values come from .secrets/dev.env (generated by `make secrets`); run through the Makefile.
x-db-env: &db-env
  PGHOST: postgres
  PGUSER: postgres
  PGDATABASE: shop
  PGPASSWORD: ${DB_SUPERUSER_PASSWORD:?run make secrets}

services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_SUPERUSER_PASSWORD:?run make secrets}
      POSTGRES_DB: shop
    volumes:
      - pgdata:/var/lib/postgresql
    # Host access for tests that check identity isolation and end state; loopback only.
    ports:
      - "127.0.0.1:55432:5432"
    healthcheck:
      # TCP, not the Unix socket: during first-run init the image runs a temporary
      # socket-only server, which would otherwise report healthy before the real one starts.
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "postgres", "-d", "shop"]
      interval: 2s
      timeout: 3s
      retries: 30

  redis:
    image: redis:8-alpine
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --maxmemory-policy
      - noeviction
      - --requirepass
      - ${REDIS_PASSWORD:?run make secrets}
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" --no-auth-warning ping | grep -q PONG"]
      interval: 2s
      timeout: 3s
      retries: 30
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}

  db-roles:
    image: postgres:18-alpine
    environment:
      <<: *db-env
      DB_MIGRATOR_PASSWORD: ${DB_MIGRATOR_PASSWORD:?run make secrets}
      DB_CATALOG_PASSWORD: ${DB_CATALOG_PASSWORD:?run make secrets}
      DB_ORDER_PASSWORD: ${DB_ORDER_PASSWORD:?run make secrets}
    volumes:
      - ./db/roles.sh:/roles.sh:ro
    entrypoint: ["sh", "/roles.sh"]
    depends_on:
      postgres:
        condition: service_healthy

  migrate-catalog:
    image: ghcr.io/amacneil/dbmate:2
    environment:
      DATABASE_URL: postgres://migrator:${DB_MIGRATOR_PASSWORD}@postgres:5432/shop?sslmode=disable
      DBMATE_MIGRATIONS_DIR: /migrations
      DBMATE_MIGRATIONS_TABLE: catalog.schema_migrations
      DBMATE_NO_DUMP_SCHEMA: "true"
    volumes:
      - ./db/catalog/migrations:/migrations:ro
    command: ["--wait", "up"]
    depends_on:
      db-roles:
        condition: service_completed_successfully

  migrate-orders:
    image: ghcr.io/amacneil/dbmate:2
    environment:
      DATABASE_URL: postgres://migrator:${DB_MIGRATOR_PASSWORD}@postgres:5432/shop?sslmode=disable
      DBMATE_MIGRATIONS_DIR: /migrations
      DBMATE_MIGRATIONS_TABLE: orders.schema_migrations
      DBMATE_NO_DUMP_SCHEMA: "true"
    volumes:
      - ./db/orders/migrations:/migrations:ro
    command: ["--wait", "up"]
    depends_on:
      db-roles:
        condition: service_completed_successfully

  catalog-cart-api:
    build:
      context: .
      dockerfile: apps/catalog-cart-api/Dockerfile
    environment:
      DATABASE_URL: postgres://catalog_app:${DB_CATALOG_PASSWORD}@postgres:5432/shop?sslmode=disable
      INTERNAL_INVENTORY_TOKEN: ${INTERNAL_INVENTORY_TOKEN:?run make secrets}
      APP_ENV: dev
    ports:
      - "127.0.0.1:4001:4001"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:4001/health/ready"]
      interval: 2s
      timeout: 3s
      retries: 30
    depends_on:
      migrate-catalog:
        condition: service_completed_successfully

  order-service:
    build:
      context: .
      dockerfile: apps/order-service/Dockerfile
    environment:
      DATABASE_URL: postgres://order_app:${DB_ORDER_PASSWORD}@postgres:5432/shop?sslmode=disable
      CATALOG_API_URL: http://catalog-cart-api:4001
      ORDER_TOKEN_SECRET: ${ORDER_TOKEN_SECRET:?run make secrets}
      APP_ENV: dev
    ports:
      - "127.0.0.1:4002:4002"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:4002/health/ready"]
      interval: 2s
      timeout: 3s
      retries: 30
    depends_on:
      migrate-orders:
        condition: service_completed_successfully
      catalog-cart-api:
        condition: service_healthy

  # No host port: the worker's listener is operational only, and the service can be scaled.
  worker:
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    environment:
      DATABASE_URL: postgres://order_app:${DB_ORDER_PASSWORD}@postgres:5432/shop?sslmode=disable
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      CATALOG_API_URL: http://catalog-cart-api:4001
      INTERNAL_INVENTORY_TOKEN: ${INTERNAL_INVENTORY_TOKEN:?run make secrets}
      APP_ENV: dev
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:4003/health/ready"]
      interval: 2s
      timeout: 3s
      retries: 30
    depends_on:
      migrate-orders:
        condition: service_completed_successfully
      catalog-cart-api:
        condition: service_healthy
      redis:
        condition: service_healthy

  storefront:
    build:
      context: .
      dockerfile: apps/storefront/Dockerfile
    environment:
      CATALOG_API_URL: http://catalog-cart-api:4001
      ORDER_SERVICE_URL: http://order-service:4002
    ports:
      - "127.0.0.1:3000:3000"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/healthz"]
      interval: 2s
      timeout: 3s
      retries: 30
    depends_on:
      catalog-cart-api:
        condition: service_healthy
      order-service:
        condition: service_healthy

  # One-shot job run by `make seed` / `make dev-up`; a profile keeps `up --wait` from
  # treating its normal exit as a failure.
  seed:
    image: postgres:18-alpine
    profiles: ["jobs"]
    environment:
      PGHOST: postgres
      PGUSER: migrator
      PGDATABASE: shop
      PGPASSWORD: ${DB_MIGRATOR_PASSWORD}
    volumes:
      - ./db/seed:/seed:ro
    entrypoint: ["psql", "-v", "ON_ERROR_STOP=1", "-f", "/seed/catalog.sql"]
    depends_on:
      migrate-catalog:
        condition: service_completed_successfully

volumes:
  pgdata:
  redisdata:
