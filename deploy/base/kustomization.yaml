# Everything an environment runs. Overlays set the namespace, environment values, and the
# exact image digests. Secrets are created out of band by `make secrets` (never in Git).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
labels:
  - pairs:
      app.kubernetes.io/part-of: shop
resources:
  - data/postgres.yaml
  - data/redis.yaml
  - jobs/db-migrate.yaml
  - apps/catalog-cart-api.yaml
  - apps/order-service.yaml
  - apps/worker.yaml
  - apps/storefront.yaml
  - apps/router.yaml
  - observability/podmonitors.yaml
  - observability/alerts.yaml
configMapGenerator:
  # Picked up by Grafana's dashboard sidecar (label grafana_dashboard=1) from any namespace.
  - name: shop-dashboards
    files:
      - observability/dashboards/shop-overview.json
    options:
      labels:
        grafana_dashboard: "1"
