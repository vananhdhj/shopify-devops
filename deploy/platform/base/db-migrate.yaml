# The control plane's database step of each release: roles, migrations, and the registry seed
# (apps/db-migrations/migrate-platform.sh). A Sync hook in wave -1, not a PreSync hook: on a fresh
# namespace a PreSync hook runs before anything else exists, so neither its ServiceAccount nor the
# database it migrates would be there yet (found on the first sync, 2026-10-11). Argo CD finishes
# wave -2 (database, this ServiceAccount) before the hook, and the hook before wave 0 (the units).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: platform-db-migrate
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
automountServiceAccountToken: false
---
apiVersion: batch/v1
kind: Job
metadata:
  name: platform-db-migrate
  annotations:
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/sync-wave: "-1"
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: 6
  activeDeadlineSeconds: 600
  template:
    spec:
      serviceAccountName: platform-db-migrate
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 70 # postgres in the image
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: db-migrate
          image: ghcr.io/vananhdhj/shopify-devops/db-migrations
          command: ["migrate-platform.sh"]
          env:
            - name: PGHOST
              value: platform-db
            - name: DB_PLATFORM_SUPERUSER_PASSWORD
              valueFrom: { secretKeyRef: { name: platform-secrets, key: DB_PLATFORM_SUPERUSER_PASSWORD } }
            - name: DB_PLATFORM_MIGRATOR_PASSWORD
              valueFrom: { secretKeyRef: { name: platform-secrets, key: DB_PLATFORM_MIGRATOR_PASSWORD } }
            - name: DB_PLATFORM_APP_PASSWORD
              valueFrom: { secretKeyRef: { name: platform-secrets, key: DB_PLATFORM_APP_PASSWORD } }
            - name: MERCHANT_CREDENTIALS
              valueFrom: { secretKeyRef: { name: platform-secrets, key: MERCHANT_CREDENTIALS } }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { memory: 128Mi }
