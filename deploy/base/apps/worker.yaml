# Worker: dispatches the outbox and settles Orders. Its listener is operational only, so it has no Service.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: worker
automountServiceAccountToken: false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
spec:
  replicas: 1
  # A new pod is ready before the old one stops: never fewer ready pods than replicas.
  strategy:
    rollingUpdate: { maxUnavailable: 0, maxSurge: 1 }
  selector:
    matchLabels:
      app.kubernetes.io/name: worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: worker
    spec:
      serviceAccountName: worker
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000 # node in the image; numeric so the kubelet can verify non-root
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: worker
          image: ghcr.io/vananhdhj/shopify-devops/worker
          env:
            - name: DB_PASSWORD
              valueFrom: { secretKeyRef: { name: shop-secrets, key: DB_ORDER_PASSWORD } }
            - name: DATABASE_URL
              value: "postgres://order_app:$(DB_PASSWORD)@postgres:5432/shop?sslmode=disable"
            - name: REDIS_PASSWORD
              valueFrom: { secretKeyRef: { name: shop-secrets, key: REDIS_PASSWORD } }
            - name: REDIS_URL
              value: "redis://:$(REDIS_PASSWORD)@redis:6379"
            - name: CATALOG_API_URL
              value: http://catalog-cart-api:4001
            - name: INTERNAL_INVENTORY_TOKEN
              valueFrom: { secretKeyRef: { name: shop-secrets, key: INTERNAL_INVENTORY_TOKEN } }
          envFrom:
            - configMapRef:
                name: shop-env # generated per environment by the overlay
          ports:
            - name: http
              containerPort: 4003
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          startupProbe:
            httpGet: { path: /health/live, port: http }
            periodSeconds: 2
            failureThreshold: 60
            timeoutSeconds: 3
          livenessProbe:
            httpGet: { path: /health/live, port: http }
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          readinessProbe:
            httpGet: { path: /health/ready, port: http }
            periodSeconds: 5
            timeoutSeconds: 3
          resources:
            requests: { cpu: 50m, memory: 96Mi }
            limits: { memory: 256Mi }
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
