# Prometheus scrapes every unit of the cell: the three Fastify units on their http port, the
# storefront on its private metrics port (instrumentation.ts); the edge, in its own namespace, has
# its own. Created before the monitoring CRDs exist on a fresh cluster, so Argo CD skips the dry
# run until they do.
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: shop-services
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  selector:
    matchExpressions:
      - { key: app.kubernetes.io/name, operator: In, values: [catalog-cart-api, order-service, worker] }
  podMetricsEndpoints:
    - port: http
      path: /metrics
      # Phase 5: the pod's cell (set by the cell's kustomization) as a `cell` label.
      relabelings:
        - sourceLabels: [__meta_kubernetes_pod_label_shop_example_cell]
          targetLabel: cell
---
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: storefront
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: storefront
  podMetricsEndpoints:
    - port: metrics
      path: /metrics
      # Phase 5: the pod's cell (set by the cell's kustomization) as a `cell` label.
      relabelings:
        - sourceLabels: [__meta_kubernetes_pod_label_shop_example_cell]
          targetLabel: cell
