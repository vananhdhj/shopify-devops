# The dev environment on the laptop's k3d cluster. CI rewrites the `digest:` lines below after
# each release build (ADR-0003); everything else changes only through pull requests.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: shop-dev
resources:
  - ../../base
  - seed-job.yaml
configMapGenerator:
  - name: shop-env
    literals:
      - APP_ENV=dev
      - COOKIE_SECURE=false # plain http on the lab ingress
      - FAULT_CHECKOUT_ERRORS=true # bad-release drill: every Checkout fails with 500
patches:
  - target: {kind: Ingress, name: storefront}
    patch: |-
      - op: replace
        path: /spec/rules/0/host
        value: shop.localhost
images:
  - name: ghcr.io/vananhdhj/shopify-devops/catalog-cart-api
    digest: sha256:c848a0d5b62052f236333ea527aa0b4be67ccf284b1e0b76941fed3ef7f2c9a1
  - name: ghcr.io/vananhdhj/shopify-devops/order-service
    digest: sha256:0823773dfe4ecc916040bc1a1001136fcb3c2d025312a165a4219446cdfd7b8d
  - name: ghcr.io/vananhdhj/shopify-devops/worker
    digest: sha256:735e2ec1b4f8cdd02f11061a56a4e2a5a6c91e8b571e852831800d8cfa20367b
  - name: ghcr.io/vananhdhj/shopify-devops/storefront
    digest: sha256:ca69d6f3b9636f467320de3c9c66c6993eb7e645d6f5ea0d41c5e271caf1d110
  - name: ghcr.io/vananhdhj/shopify-devops/db-migrations
