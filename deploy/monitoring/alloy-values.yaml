# Grafana Alloy for the laptop lab (Phase 7, decision 1): one agent per node that reads every pod's
# log files on the node and pushes their lines to Loki, and receives the
# units' spans over OTLP/HTTP (port 4318) and sends them to Tempo. Chart version pinned in
# application.yaml.
# Pinned by digest (the manifest policies, ticket 01): v1.20.1, multi-arch.
image:
  tag: v1.20.1
  digest: sha256:2aa2099af76c0098d4af7a4d6e48f86cb66dc1a000222ad927a1c67c6542d13f

controller:
  type: daemonset
  # Alloy's own state (positions of the logs it has read), with a read-only root filesystem.
  volumes:
    extra:
      - name: alloy-data
        emptyDir: {}

alloy:
  # The node's pod log files (/var/log/pods, read-only). Reading them through the Kubernetes API
  # instead reopened streams hundreds of times an hour, kept k3s at 200% CPU, and lost lines on
  # reconnects (Phase 7 evidence). The files are root-owned 0640: the agent runs as root, with
  # every capability dropped and a read-only root filesystem, the one exception to the non-root
  # policy (policy/kubernetes.rego).
  mounts:
    varlog: true
    extra:
      - name: alloy-data
        mountPath: /tmp/alloy
  securityContext:
    runAsUser: 0
    runAsNonRoot: false
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    capabilities: { drop: ["ALL"] }
  resources:
    requests: { cpu: 25m, memory: 64Mi }
    limits: { memory: 192Mi }
  # The OTLP/HTTP receiver, on the agent's Service.
  extraPorts:
    - name: otlp-http
      port: 4318
      targetPort: 4318
      protocol: TCP
  extraEnv:
    - name: NODE_NAME
      valueFrom: { fieldRef: { fieldPath: spec.nodeName } }
    - name: GOMEMLIMIT
      value: 150MiB
  storagePath: /tmp/alloy
  configMap:
    content: |
      // Pods on this node (one watch on the API), to label each file's lines.
      discovery.kubernetes "pods" {
        role = "pod"
        selectors {
          role  = "pod"
          field = "spec.nodeName=" + sys.env("NODE_NAME")
        }
      }

      // Stream labels: namespace, cell (the pod label of Phase 5), app, and instance (the pod and
      // container, bounded by the pods of the retention). tenant_id, requestId, and traceId stay
      // inside the JSON line (LogQL `| json`).
      discovery.relabel "pods" {
        targets = discovery.kubernetes.pods.targets
        rule {
          source_labels = ["__meta_kubernetes_namespace"]
          target_label  = "namespace"
        }
        rule {
          source_labels = ["__meta_kubernetes_pod_label_shop_example_cell"]
          target_label  = "cell"
        }
        // app: the pod's `app` label, replaced by `app.kubernetes.io/name` when it has one.
        rule {
          source_labels = ["__meta_kubernetes_pod_label_app"]
          target_label  = "app"
        }
        rule {
          source_labels = ["__meta_kubernetes_pod_label_app_kubernetes_io_name"]
          regex         = "(.+)"
          target_label  = "app"
        }
        rule {
          source_labels = ["__meta_kubernetes_namespace", "__meta_kubernetes_pod_name", "__meta_kubernetes_pod_container_name"]
          regex         = "(.+);(.+);(.+)"
          replacement   = "$1/$2:$3"
          target_label  = "instance"
        }
        // The container's log files: /var/log/pods/<namespace>_<pod>_<uid>/<container>/<n>.log.
        rule {
          source_labels = ["__meta_kubernetes_pod_uid", "__meta_kubernetes_pod_container_name"]
          separator     = "/"
          replacement   = "/var/log/pods/*$1/*.log"
          target_label  = "__path__"
        }
      }

      local.file_match "pods" {
        path_targets = discovery.relabel.pods.output
      }

      loki.source.file "pods" {
        targets    = local.file_match.pods.targets
        forward_to = [loki.process.pods.receiver]
      }

      // Each file line is the CRI's `<time> <stream> <flag> <line>`: keep the line and its time,
      // and drop the per-file label.
      loki.process "pods" {
        stage.cri {}
        stage.label_drop {
          values = ["filename"]
        }
        forward_to = [loki.write.lab.receiver]
      }

      loki.write "lab" {
        endpoint {
          url = "http://loki.monitoring.svc:3100/loki/api/v1/push"
        }
      }

      // Traces (Phase 7): every unit sends OTLP/HTTP here; batched and passed on to Tempo.
      otelcol.receiver.otlp "units" {
        http {
          endpoint = "0.0.0.0:4318"
        }
        output {
          traces = [otelcol.processor.batch.traces.input]
        }
      }

      otelcol.processor.batch "traces" {
        output {
          traces = [otelcol.exporter.otlp.tempo.input]
        }
      }

      otelcol.exporter.otlp "tempo" {
        client {
          endpoint = "tempo.monitoring.svc:4317"
          tls {
            insecure = true
          }
        }
      }

configReloader:
  resources:
    requests: { cpu: 5m, memory: 16Mi }
    limits: { memory: 32Mi }
  securityContext:
    runAsNonRoot: true
    runAsUser: 473
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    capabilities: { drop: ["ALL"] }
