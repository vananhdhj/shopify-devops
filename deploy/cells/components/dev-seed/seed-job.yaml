# Dev only: after every sync, reset the cell's seed products to their seed price and Stock, so the
# lab always starts from known data. Never part of a production-like overlay.
apiVersion: batch/v1
kind: Job
metadata:
  name: db-seed
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: 3
  activeDeadlineSeconds: 300
  template:
    spec:
      serviceAccountName: db-migrate
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 70
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: db-seed
          image: ghcr.io/vananhdhj/shopify-devops/db-migrations
          command: ["seed.sh"]
          env:
            - name: PGHOST
              value: postgres
            - name: SEED_FILE
              value: catalog.sql # pool-1's shops; the canary cell patches it
            - name: DB_MIGRATOR_PASSWORD
              valueFrom: { secretKeyRef: { name: shop-secrets, key: DB_MIGRATOR_PASSWORD } }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests: { cpu: 25m, memory: 32Mi }
            limits: { memory: 64Mi }
