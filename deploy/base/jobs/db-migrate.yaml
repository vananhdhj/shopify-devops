# The database step of each release. As an Argo CD PreSync hook it runs, and must succeed,
# before any new application pod is synced; migrations are backward-compatible, so the old
# pods keep working against the new schema meanwhile.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: db-migrate
automountServiceAccountToken: false
---
apiVersion: batch/v1
kind: Job
metadata:
  name: db-migrate
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: 6
  activeDeadlineSeconds: 600
  template:
    spec:
      serviceAccountName: db-migrate
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 70 # postgres in the image
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: db-migrate
          image: ghcr.io/vananhdhj/shopify-devops/db-migrations
          command: ["migrate.sh"]
          env:
            - name: PGHOST
              value: postgres
            - name: DB_SUPERUSER_PASSWORD
              valueFrom: { secretKeyRef: { name: shop-secrets, key: DB_SUPERUSER_PASSWORD } }
            - name: DB_MIGRATOR_PASSWORD
              valueFrom: { secretKeyRef: { name: shop-secrets, key: DB_MIGRATOR_PASSWORD } }
            - name: DB_CATALOG_PASSWORD
              valueFrom: { secretKeyRef: { name: shop-secrets, key: DB_CATALOG_PASSWORD } }
            - name: DB_ORDER_PASSWORD
              valueFrom: { secretKeyRef: { name: shop-secrets, key: DB_ORDER_PASSWORD } }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { memory: 128Mi }
