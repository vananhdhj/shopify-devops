# Platform worker: lifecycle workflows (provisioning, deletion). It reaches the cell's router (to
# check a new shop like a buyer would) and the cell's two APIs (to purge a deleted shop).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: platform-worker
automountServiceAccountToken: false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: platform-worker
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: platform-worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: platform-worker
    spec:
      serviceAccountName: platform-worker
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000 # node in the image; numeric so the kubelet can verify non-root
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: platform-worker
          image: ghcr.io/vananhdhj/shopify-devops/platform
          command: ["node", "dist/worker-server.js"]
          env:
            - name: DB_PASSWORD
              valueFrom: { secretKeyRef: { name: platform-secrets, key: DB_PLATFORM_APP_PASSWORD } }
            - name: DATABASE_URL
              value: "postgres://platform_app:$(DB_PASSWORD)@platform-db:5432/platform?sslmode=disable"
            - name: PLATFORM_CELL_TOKEN
              valueFrom: { secretKeyRef: { name: platform-secrets, key: PLATFORM_CELL_TOKEN } }
          envFrom:
            - configMapRef:
                name: platform-env # the cell's addresses and the base domain, per environment
          ports:
            - name: ops
              containerPort: 8102
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          startupProbe:
            httpGet: { path: /health/live, port: ops }
            periodSeconds: 2
            failureThreshold: 30
          livenessProbe:
            httpGet: { path: /health/live, port: ops }
            periodSeconds: 10
          readinessProbe:
            httpGet: { path: /health/ready, port: ops }
            periodSeconds: 5
          resources:
            requests: { cpu: 25m, memory: 64Mi }
            limits: { memory: 192Mi }
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
