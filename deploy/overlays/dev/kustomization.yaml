# The dev environment on the laptop's k3d cluster. CI rewrites the `digest:` lines below after
# each release build (ADR-0003); everything else changes only through pull requests.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: shop-dev
resources:
  - ../../base
  - seed-job.yaml
configMapGenerator:
  - name: shop-env
    literals:
      - APP_ENV=dev
      - COOKIE_SECURE=false # plain http on the lab ingress
      - TENANT_BASE_DOMAIN=shop.localhost
patches:
  - target: {kind: Ingress, name: router}
    patch: |-
      - op: replace
        path: /spec/rules/0/host
        value: "*.shop.localhost"
images:
  - name: ghcr.io/vananhdhj/shopify-devops/catalog-cart-api
    digest: sha256:8daee843fe511b8479503deddfd028305cec16b0ae26e6f5b0bcc02e127a5b0f
  - name: ghcr.io/vananhdhj/shopify-devops/order-service
    digest: sha256:db98be5fc3ee9a87cd84b069aebe8726dbf20e150859d2d5366bf7c7b4a05e6a
  - name: ghcr.io/vananhdhj/shopify-devops/worker
