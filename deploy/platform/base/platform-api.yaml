# Platform API: the registry's two listeners. `public` (signup pages) is what the cells' routers
# forward from the bare platform address; `internal` serves the routers, storefronts, and the
# lifecycle worker, the operator by port-forward, and health and metrics. Neither is on an ingress.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: platform-api
automountServiceAccountToken: false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: platform-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: platform-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: platform-api
    spec:
      serviceAccountName: platform-api
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000 # node in the image; numeric so the kubelet can verify non-root
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: platform-api
          image: ghcr.io/vananhdhj/shopify-devops/platform
          env:
            - name: DB_PASSWORD
              valueFrom: { secretKeyRef: { name: platform-secrets, key: DB_PLATFORM_APP_PASSWORD } }
            - name: DATABASE_URL
              value: "postgres://platform_app:$(DB_PASSWORD)@platform-db:5432/platform?sslmode=disable"
            - name: PLATFORM_ROUTER_TOKEN
              valueFrom: { secretKeyRef: { name: platform-secrets, key: PLATFORM_ROUTER_TOKEN } }
            - name: PLATFORM_OPERATOR_TOKEN
              valueFrom: { secretKeyRef: { name: platform-secrets, key: PLATFORM_OPERATOR_TOKEN } }
            # Each cell's registration and storefront tokens, one file per cell and key.
            - name: CELL_CREDENTIALS_DIR
              value: /run/cell-credentials
          envFrom:
            - configMapRef:
                name: platform-env # generated per environment by the overlay
          ports:
            - name: public
              containerPort: 8100
            - name: internal
              containerPort: 8101
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          startupProbe:
            httpGet: { path: /health/live, port: internal }
            periodSeconds: 2
            failureThreshold: 60
            timeoutSeconds: 3
          livenessProbe:
            httpGet: { path: /health/live, port: internal }
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          readinessProbe:
            httpGet: { path: /health/ready, port: internal }
            periodSeconds: 5
            timeoutSeconds: 3
          resources:
            requests: { cpu: 50m, memory: 96Mi }
            limits: { memory: 256Mi }
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: cell-credentials
              mountPath: /run/cell-credentials
              readOnly: true
      volumes:
        - name: tmp
          emptyDir: {}
        # One file per cell and key, from `make secrets`; a cell added later appears in place.
        - name: cell-credentials
          secret:
            secretName: cell-credentials
---
apiVersion: v1
kind: Service
metadata:
  name: platform-api
spec:
  selector:
    app.kubernetes.io/name: platform-api
  ports:
    - name: public
      port: 8100
      targetPort: public
    - name: internal
      port: 8101
      targetPort: internal
