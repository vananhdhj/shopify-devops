# Argo CD for the laptop lab (chart pinned in the Makefile). Only what GitOps for one repo needs:
# no SSO (Dex), no notifications; the ApplicationSet controller makes one Application per cell
# (deploy/argocd/cells-dev.yaml). The UI/API stays a ClusterIP service,
# reached only through `kubectl port-forward`; plain HTTP is fine on that loopback tunnel.
dex:
  enabled: false
notifications:
  enabled: false
applicationSet:
  replicas: 1
  resources:
    requests: { cpu: 10m, memory: 32Mi }
    limits: { memory: 128Mi }
configs:
  params:
    server.insecure: true
  cm:
    # Poll Git every 60 s (no webhook can reach a laptop).
    timeout.reconciliation: 60s
controller:
  resources:
    requests: { cpu: 100m, memory: 256Mi }
    limits: { memory: 768Mi }
repoServer:
  resources:
    requests: { cpu: 50m, memory: 128Mi }
    limits: { memory: 512Mi }
server:
  resources:
    requests: { cpu: 25m, memory: 64Mi }
    limits: { memory: 256Mi }
redis:
  resources:
    requests: { cpu: 25m, memory: 32Mi }
    limits: { memory: 128Mi }
