name: ci

# Pull-request checks. No deployment credentials exist here: the token is read-only and no
# secrets are referenced, so untrusted changes can't reach a registry or a cluster.
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read # the path filter lists a PR's changed files through the API

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      services: ${{ steps.affected.outputs.services }}
      integration: ${{ steps.affected.outputs.integration }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: filter
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          filters: .github/path-filters.yml
      - id: affected
        run: .github/scripts/affected-services.sh '${{ steps.filter.outputs.changes }}' '${{ github.event_name == 'workflow_dispatch' }}'

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      # Phase 4: the previous release's images run against the new schema while a release moves
      # through the waves, so a migration may only expand it (ADR-0021).
      - name: The migration check refuses and accepts its fixtures
        run: |
          python3 scripts/migration-lint.py tests/migration-lint/accepted/*.sql
          for fixture in tests/migration-lint/refused/*.sql; do
            if python3 scripts/migration-lint.py "$fixture" >/dev/null; then echo "::error::accepted ${fixture}"; exit 1; fi
          done
      - name: New migrations only expand the schema; applied ones are never edited
        if: github.event_name == 'pull_request'
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          git fetch --no-tags --depth=1 origin "$BASE"
          added=() status=0
          while IFS=$'\t' read -r change path; do
            case "$change" in
              A) added+=("$path") ;;
              *) echo "::error file=${path}::an applied migration is never edited or removed; add a new one"; status=1 ;;
            esac
          done < <(git diff --name-status "$BASE" HEAD -- 'db/*/migrations/*.sql')
          if [ "${#added[@]}" -gt 0 ]; then python3 scripts/migration-lint.py "${added[@]}" || status=1; fi
          exit "$status"

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the whole history, including commits made before anyone ran `make hooks`
      - name: Install gitleaks (checksum-verified)
        env:
          VERSION: "8.30.1"
        run: |
          base="https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}"
          curl -fsSLO "${base}/gitleaks_${VERSION}_linux_x64.tar.gz"
          curl -fsSLO "${base}/gitleaks_${VERSION}_checksums.txt"
          grep " gitleaks_${VERSION}_linux_x64.tar.gz$" "gitleaks_${VERSION}_checksums.txt" | sha256sum --check
          tar -xzf "gitleaks_${VERSION}_linux_x64.tar.gz" gitleaks
      - run: ./gitleaks git --redact --no-banner --verbose .

  service:
    needs: changes
    if: needs.changes.outputs.services != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJSON(needs.changes.outputs.services) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Typecheck ${{ matrix.service }} and the packages it depends on
        if: hashFiles(format('apps/{0}/package.json', matrix.service)) != ''
        run: pnpm turbo run typecheck --filter="@shop/${{ matrix.service }}..."
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build the ${{ matrix.service }} image (not pushed)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: apps/${{ matrix.service }}/Dockerfile
          push: false
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

  # Renders both overlays (dev runs on the lab cluster; staging is never applied) and validates
  # every object against the Kubernetes API schema, so a broken manifest never reaches Argo CD.
  manifests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install kubeconform (checksum-verified)
        env:
          VERSION: "0.8.0"
        run: |
          base="https://github.com/yannh/kubeconform/releases/download/v${VERSION}"
          curl -fsSLO "${base}/kubeconform-linux-amd64.tar.gz"
          curl -fsSLO "${base}/CHECKSUMS"
          grep " kubeconform-linux-amd64.tar.gz$" CHECKSUMS | sha256sum --check
          tar -xzf kubeconform-linux-amd64.tar.gz kubeconform
      - name: Render and validate every cell, the control-plane and edge overlays, monitoring config, and Argo CD Applications
        env:
          # Custom resources (PodMonitor, PrometheusRule, Application) validate against the
          # community CRD schema catalog instead of being skipped.
          CRD_SCHEMAS: https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json
        run: |
          scripts/render-manifests.sh rendered
          ./kubeconform -strict -summary -kubernetes-version 1.35.0 -schema-location default -schema-location "$CRD_SCHEMAS" \
            rendered/*.yaml deploy/argocd/cells-dev.yaml deploy/argocd/platform-dev.yaml deploy/argocd/edge-dev.yaml \
            deploy/monitoring/application.yaml
      - name: Install Conftest (checksum-verified)
        env:
          VERSION: "0.71.1"
        run: |
          base="https://github.com/open-policy-agent/conftest/releases/download/v${VERSION}"
          curl -fsSLO "${base}/conftest_${VERSION}_Linux_x86_64.tar.gz"
          curl -fsSLO "${base}/checksums.txt"
          grep " conftest_${VERSION}_Linux_x86_64.tar.gz$" checksums.txt | sha256sum --check
          tar -xzf "conftest_${VERSION}_Linux_x86_64.tar.gz" conftest
          sudo mv conftest /usr/local/bin/
      - name: Manifest policies (no privilege or root, resource bounds, approved and pinned images, no plain Secrets)
        run: scripts/policy.sh rendered
      - name: Every dev cell names itself, its namespace, and its wave; the waves run 0, 1, 2… without a gap
        run: |
          for file in deploy/cells/dev/*/cell.json; do
            dir="$(basename "$(dirname "$file")")"
            jq -e --arg dir "$dir" '.cell == $dir and (.namespace | type == "string" and length > 0)
              and (.wave | type == "number" and . >= 0 and floor == .)' "$file" >/dev/null ||
              { echo "::error file=${file}::needs cell (its directory name), namespace, and an integer wave"; exit 1; }
          done
          # A release reaches wave 0 and is promoted one wave at a time, so a gap would strand every later wave.
          jq -se '[.[].wave] | unique | . == [range(0; length)]' deploy/cells/dev/*/cell.json >/dev/null ||
            { echo "::error::the dev cells' waves must be 0, 1, 2… with no gap"; exit 1; }
      - name: The tenant SLO rules parse and pass their promtool tests
        run: |
          yq '.spec' deploy/monitoring/config/slo-rules.yaml > tests/prometheus/slo-rules.rules.yaml
          docker run --rm -v "$PWD/tests/prometheus:/rules" -w /rules --entrypoint promtool quay.io/prometheus/prometheus:v3.15.0-distroless check rules slo-rules.rules.yaml
          docker run --rm -v "$PWD/tests/prometheus:/rules" -w /rules --entrypoint promtool quay.io/prometheus/prometheus:v3.15.0-distroless test rules slo-test.yaml
      - name: Every workload image is pinned by digest
        run: |
          unpinned="$(grep -hE '^\s+image:' rendered/*.yaml | grep -v '@sha256:' || true)"
          if [ -n "$unpinned" ]; then echo "::error::images without a digest:"; echo "$unpinned"; exit 1; fi

  # Runs on both architectures the release publishes. Compose builds the images natively on each
  # runner, so the arm64 leg exercises the arm64 images the lab cluster pulls before they deploy.
  integration:
    needs: changes
    if: needs.changes.outputs.integration == 'true'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, ubuntu-24.04-arm] # amd64, arm64 (the M2 laptop's k3d cluster)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Service-HTTP tests against the Compose stack (throwaway generated secrets)
        run: make test
      - name: Stack logs on failure
        if: failure()
        run: docker compose -f compose.yaml -f compose.dedicated-1.yaml --env-file .secrets/dev.env --env-file .secrets/cells/pool-1.env --env-file .secrets/compose-cells.env logs --no-color --tail 200

  # Phase 4's mixed-version check (ADR-0021): while a release moves through the waves, the last
  # wave still runs the previous release's cell images, on the schema the new release migrated
  # to, behind the new control plane and edge. This runs exactly that, pulled from GHCR by the
  # digests main pins for the last wave, and a shop's whole life through the edge.
  compat:
    needs: changes
    if: needs.changes.outputs.integration == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: The previous release's cell images with this change's migrations, control plane, and edge
        run: make compat
      - name: Stack logs on failure
        if: failure()
        run: docker compose -f compose.yaml -f compose.dedicated-1.yaml --env-file .secrets/dev.env --env-file .secrets/cells/pool-1.env --env-file .secrets/compose-cells.env -f .local/compose.compat.yaml logs --no-color --tail 200

  # The one check branch protection requires. It always runs, fails if any job failed or was
  # cancelled, and accepts jobs skipped because nothing they cover changed.
  ci-ok:
    if: always()
    needs: [changes, lint, secret-scan, manifests, service, integration, compat]
    runs-on: ubuntu-latest
    steps:
      - name: All required jobs passed or were intentionally skipped
        env:
          RESULTS: ${{ toJSON(needs.*.result) }}
        run: |
          echo "job results: $RESULTS"
          if jq -e 'any(.[]; . == "failure" or . == "cancelled")' <<<"$RESULTS" >/dev/null; then
            echo "::error::a required job failed or was cancelled"
            exit 1
          fi
