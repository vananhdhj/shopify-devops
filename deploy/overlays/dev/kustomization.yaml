# The dev environment on the laptop's k3d cluster. CI rewrites the `digest:` lines below after
# each release build (ADR-0003); everything else changes only through pull requests.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: shop-dev
resources:
  - ../../base
  - seed-job.yaml
configMapGenerator:
  - name: shop-env
    literals:
      - APP_ENV=dev
      - COOKIE_SECURE=false # plain http on the lab ingress
patches:
  - target: {kind: Ingress, name: storefront}
    patch: |-
      - op: replace
        path: /spec/rules/0/host
        value: shop.localhost
images:
  - name: ghcr.io/vananhdhj/shopify-devops/catalog-cart-api
    digest: sha256:c8e78cdceaa19cacec16331dddf8f743f78ac6abea23107d4470b0d4ac7c5b9d
  - name: ghcr.io/vananhdhj/shopify-devops/order-service
    digest: sha256:87298f627400e1ae84758a8b887035e3b8c7e2448fa16d18f53a5ae67e89fbcc
  - name: ghcr.io/vananhdhj/shopify-devops/worker
    digest: sha256:e9e2f38af107aec1153275f095dca32933d9d24ba6aaba3f888422f6c7b9bb60
  - name: ghcr.io/vananhdhj/shopify-devops/storefront
    digest: sha256:d708784f48626b3e2dd75bf908f4f1aefa5b1e8d702fcccca608060658b55d41
  - name: ghcr.io/vananhdhj/shopify-devops/db-migrations
