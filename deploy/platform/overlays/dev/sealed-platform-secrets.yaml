# platform-dev/platform-secrets, sealed by scripts/seal-secrets.py (`make secrets`) against
# deploy/sealed-secrets/cert.pem; only the cluster's controller can decrypt it. Regenerated, never edited.
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: platform-secrets
  namespace: platform-dev
  annotations:
    shop.example/sealed-from: efaa297c2de15acbd79c8811968497630276210de37eac75443b744a79a140db
spec:
  encryptedData:
    DB_PLATFORM_APP_PASSWORD: 
    DB_PLATFORM_MIGRATOR_PASSWORD: 
    DB_PLATFORM_SUPERUSER_PASSWORD: 
    GITHUB_PROMOTE_TOKEN: 
    MERCHANT_CREDENTIALS: 
    PLATFORM_OPERATOR_TOKEN: 
    PLATFORM_ROUTER_TOKEN: 
  template:
    metadata:
      name: platform-secrets
      namespace: platform-dev
      labels:
        app.kubernetes.io/part-of: shop
    type: Opaque
