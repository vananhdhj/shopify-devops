apiVersion: apps/v1
kind: Deployment
metadata:
  name: root-user
spec:
  selector: { matchLabels: { app: root-user } }
  template:
    metadata: { labels: { app: root-user } }
    spec:
      securityContext: { runAsNonRoot: true, runAsUser: 0 }
      containers:
        - name: app
          image: ghcr.io/vananhdhj/shopify-devops/router@sha256:1111111111111111111111111111111111111111111111111111111111111111
          securityContext: { allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: { drop: ["ALL"] } }
          resources: { requests: { cpu: 10m, memory: 32Mi }, limits: { memory: 64Mi } }
