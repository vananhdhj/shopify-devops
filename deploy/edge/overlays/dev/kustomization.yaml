# The dev edge on the laptop's k3d cluster: the ingress for every shop of every dev cell and the
# platform's signup pages (Traefik on 127.0.0.1:8080). CI rewrites the `digest:` line below after
# each release build (ADR-0003).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: edge-dev
resources:
  - ../../base
  # Secrets, sealed for Git (Phase 7): `make secrets` writes them; the controller decrypts them.
  - sealed-edge-secrets.yaml
  - sealed-cell-credentials.yaml
configMapGenerator:
  - name: edge-env
    literals:
      - APP_ENV=dev
      - TENANT_BASE_DOMAIN=shop.localhost
      # Traces (Phase 7): OTLP to Alloy; every request starts its trace here.
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://alloy.monitoring.svc:4318
      # The control plane: the routing table (with the cell directory) and the signup pages.
      - PLATFORM_API_URL=http://platform-api.platform-dev:8101
      - PLATFORM_PUBLIC_URL=http://platform-api.platform-dev:8100
patches:
  - target: {kind: Ingress, name: edge}
    patch: |-
      - op: replace
        path: /spec/rules/0/host
        value: "*.shop.localhost"
      - op: replace
        path: /spec/rules/1/host
        value: shop.localhost
images:
  - name: ghcr.io/vananhdhj/shopify-devops/router
    digest: sha256:ffefba29f9097fe41a483b32116e35b7dcd0b25e78d25127b2e7b3435b1f3be5
