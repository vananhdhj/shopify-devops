# The dev control plane on the laptop's k3d cluster, managing the dev cells. CI
# rewrites the `digest:` lines below after each release build, as for the cell (ADR-0003).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: platform-dev
resources:
  - ../../base
configMapGenerator:
  - name: platform-env
    literals:
      - APP_ENV=dev
      - TENANT_BASE_DOMAIN=shop.localhost
      # Where a new shop is checked like a buyer would; each cell's APIs come from the cell directory.
      - EDGE_URL=http://edge.edge-dev:8000
images:
  - name: ghcr.io/vananhdhj/shopify-devops/platform
    digest: sha256:5eed50b2259decf0ca71950ccc7706f14283944d38e84b97ba76017aed06408c
  - name: ghcr.io/vananhdhj/shopify-devops/db-migrations
    digest: sha256:9f8db3bfad53e32bc291468bb57bb44c4a333ce84adcc97c0f0e1628d0f2070a
