# Prometheus scrapes every unit: the three Fastify units on their http port, the storefront on its
# private metrics port (instrumentation.ts), the router on its private ops port. Created before the monitoring CRDs exist on a fresh
# cluster, so Argo CD skips the dry run until they do.
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: shop-services
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  selector:
    matchExpressions:
      - { key: app.kubernetes.io/name, operator: In, values: [catalog-cart-api, order-service, worker] }
  podMetricsEndpoints:
    - port: http
      path: /metrics
---
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: storefront
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: storefront
  podMetricsEndpoints:
    - port: metrics
      path: /metrics
---
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: router
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: router
  podMetricsEndpoints:
    - port: ops
      path: /metrics
