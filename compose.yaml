name: shopify-devops

# Values come from .secrets/dev.env (the platform's) and .secrets/cells/pool-1.env (the default
# cell's), generated by `make secrets`; run through the Makefile.
x-db-env: &db-env
  PGHOST: postgres
  PGUSER: postgres
  PGDATABASE: shop
  PGPASSWORD: ${DB_SUPERUSER_PASSWORD:?run make secrets}

services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_SUPERUSER_PASSWORD:?run make secrets}
      POSTGRES_DB: shop
    volumes:
      - pgdata:/var/lib/postgresql
    # Host access for tests that check identity isolation and end state; loopback only.
    ports:
      - "127.0.0.1:55432:5432"
    healthcheck:
      # TCP, not the Unix socket: during first-run init the image runs a temporary
      # socket-only server, which would otherwise report healthy before the real one starts.
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "postgres", "-d", "shop"]
      interval: 2s
      timeout: 3s
      retries: 30

  redis:
    image: redis:8-alpine
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --maxmemory-policy
      - noeviction
      - --requirepass
      - ${REDIS_PASSWORD:?run make secrets}
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" --no-auth-warning ping | grep -q PONG"]
      interval: 2s
      timeout: 3s
      retries: 30
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}

  db-roles:
    image: postgres:18-alpine
    environment:
      <<: *db-env
      DB_MIGRATOR_PASSWORD: ${DB_MIGRATOR_PASSWORD:?run make secrets}
      DB_CATALOG_PASSWORD: ${DB_CATALOG_PASSWORD:?run make secrets}
      DB_ORDER_PASSWORD: ${DB_ORDER_PASSWORD:?run make secrets}
    volumes:
      - ./db/roles.sh:/roles.sh:ro
    entrypoint: ["sh", "/roles.sh"]
    depends_on:
      postgres:
        condition: service_healthy

  migrate-catalog:
    image: ghcr.io/amacneil/dbmate:2
    environment:
      DATABASE_URL: postgres://migrator:${DB_MIGRATOR_PASSWORD}@postgres:5432/shop?sslmode=disable
      DBMATE_MIGRATIONS_DIR: /migrations
      DBMATE_MIGRATIONS_TABLE: catalog.schema_migrations
      DBMATE_NO_DUMP_SCHEMA: "true"
    volumes:
      - ./db/catalog/migrations:/migrations:ro
    command: ["--wait", "up"]
    depends_on:
      db-roles:
        condition: service_completed_successfully

  migrate-orders:
    image: ghcr.io/amacneil/dbmate:2
    environment:
      DATABASE_URL: postgres://migrator:${DB_MIGRATOR_PASSWORD}@postgres:5432/shop?sslmode=disable
      DBMATE_MIGRATIONS_DIR: /migrations
      DBMATE_MIGRATIONS_TABLE: orders.schema_migrations
      DBMATE_NO_DUMP_SCHEMA: "true"
    volumes:
      - ./db/orders/migrations:/migrations:ro
    command: ["--wait", "up"]
    depends_on:
      db-roles:
        condition: service_completed_successfully

  catalog-cart-api:
    build:
      context: .
      dockerfile: apps/catalog-cart-api/Dockerfile
    environment:
      OTEL_EXPORTER_OTLP_ENDPOINT: http://tempo:4318
      OTEL_RESOURCE_ATTRIBUTES: cell=pool-1
      DATABASE_URL: postgres://catalog_app:${DB_CATALOG_PASSWORD}@postgres:5432/shop?sslmode=disable
      INTERNAL_INVENTORY_TOKEN: ${INTERNAL_INVENTORY_TOKEN:?run make secrets}
      ADMIN_SERVICE_TOKEN: ${ADMIN_SERVICE_TOKEN:?run make secrets}
      TENANT_CONTEXT_SECRET: ${TENANT_CONTEXT_SECRET:?run make secrets}
      PLATFORM_CELL_TOKEN: ${PLATFORM_CELL_TOKEN:?run make secrets}
      # The seeded shops' catalogs grow with every test run (the volume outlives the stack): no
      # product quota for them here only.
      PRODUCT_QUOTA_EXEMPT: harbor,meadow
      APP_ENV: dev
    ports:
      - "127.0.0.1:4001:4001"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:4001/health/ready"]
      interval: 2s
      timeout: 3s
      retries: 30
    depends_on:
      migrate-catalog:
        condition: service_completed_successfully

  order-service:
    build:
      context: .
      dockerfile: apps/order-service/Dockerfile
    environment:
      OTEL_EXPORTER_OTLP_ENDPOINT: http://tempo:4318
      OTEL_RESOURCE_ATTRIBUTES: cell=pool-1
      DATABASE_URL: postgres://order_app:${DB_ORDER_PASSWORD}@postgres:5432/shop?sslmode=disable
      CATALOG_API_URL: http://catalog-cart-api:4001
      ORDER_TOKEN_SECRET: ${ORDER_TOKEN_SECRET:?run make secrets}
      ADMIN_SERVICE_TOKEN: ${ADMIN_SERVICE_TOKEN:?run make secrets}
      TENANT_CONTEXT_SECRET: ${TENANT_CONTEXT_SECRET:?run make secrets}
      PLATFORM_CELL_TOKEN: ${PLATFORM_CELL_TOKEN:?run make secrets}
      # The seeded shops' contention tests send 100 concurrent Checkouts: no cap for them here only.
      CHECKOUT_LIMIT_EXEMPT: harbor,meadow
      APP_ENV: dev
    ports:
      - "127.0.0.1:4002:4002"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:4002/health/ready"]
      interval: 2s
      timeout: 3s
      retries: 30
    depends_on:
      migrate-orders:
        condition: service_completed_successfully
      catalog-cart-api:
        condition: service_healthy

  # No host port: the worker's listener is operational only, and the service can be scaled.
  worker:
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    environment:
      OTEL_EXPORTER_OTLP_ENDPOINT: http://tempo:4318
      OTEL_RESOURCE_ATTRIBUTES: cell=pool-1
      DATABASE_URL: postgres://order_app:${DB_ORDER_PASSWORD}@postgres:5432/shop?sslmode=disable
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      CATALOG_API_URL: http://catalog-cart-api:4001
      INTERNAL_INVENTORY_TOKEN: ${INTERNAL_INVENTORY_TOKEN:?run make secrets}
      APP_ENV: dev
      # Short retry and reconciliation windows in dev, so failure drills finish in seconds.
      SETTLE_ATTEMPTS: "5"
      SETTLE_BACKOFF_MS: "250"
      RECONCILE_INTERVAL_MS: "2000"
      RECONCILE_STALE_AFTER_MS: "5000"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:4003/health/ready"]
      interval: 2s
      timeout: 3s
      retries: 30
    depends_on:
      migrate-orders:
        condition: service_completed_successfully
      catalog-cart-api:
        condition: service_healthy
      redis:
        condition: service_healthy

  storefront:
    build:
      context: .
      dockerfile: apps/storefront/Dockerfile
    environment:
      OTEL_EXPORTER_OTLP_ENDPOINT: http://tempo:4318
      OTEL_RESOURCE_ATTRIBUTES: cell=pool-1
      CATALOG_API_URL: http://catalog-cart-api:4001
      ORDER_SERVICE_URL: http://order-service:4002
      ADMIN_SERVICE_TOKEN: ${ADMIN_SERVICE_TOKEN:?run make secrets}
      SESSION_SECRET: ${SESSION_SECRET:?run make secrets}
      # Merchant sign-in is checked by the control plane; the credentials never reach the cell.
      PLATFORM_API_URL: http://platform-api:8101
      PLATFORM_STOREFRONT_TOKEN: ${PLATFORM_STOREFRONT_TOKEN:?run make secrets}
      TENANT_CONTEXT_SECRET: ${TENANT_CONTEXT_SECRET:?run make secrets}
      APP_ENV: dev
    ports:
      - "127.0.0.1:3000:3000"
      - "127.0.0.1:9464:9464" # private metrics listener (instrumentation.ts)
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/healthz"]
      interval: 2s
      timeout: 3s
      retries: 30
    depends_on:
      catalog-cart-api:
        condition: service_healthy
      order-service:
        condition: service_healthy

  # The edge, for every cell: maps <handle>.shop.localhost to a tenant and that tenant's cell, and
  # proxies to the cell's storefront with a tenant context signed by the cell's own secret. Health
  # and metrics are on its private port 8001.
  edge:
    build:
      context: .
      dockerfile: apps/router/Dockerfile
    environment:
      OTEL_EXPORTER_OTLP_ENDPOINT: http://tempo:4318
      TENANT_BASE_DOMAIN: shop.localhost
      # Each cell's tenant-context secret, one file per cell; the cells' storefronts come from the
      # routing table.
      CELL_CREDENTIALS_DIR: /run/cell-credentials
      PLATFORM_API_URL: http://platform-api:8101
      PLATFORM_ROUTER_TOKEN: ${PLATFORM_ROUTER_TOKEN:?run make secrets}
      # The bare base domain serves the control plane's signup pages.
      PLATFORM_PUBLIC_URL: http://platform-api:8100
      # The test suites drive the seeded shops and the signup pages far harder than buyers would:
      # exempt from rate limits here only; every other shop gets its plan's limits. The cluster
      # exempts nothing.
      RATE_LIMIT_EXEMPT: harbor,meadow,platform
      APP_ENV: dev
    volumes:
      - ./.secrets/mounts/edge:/run/cell-credentials:ro
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8001/health/ready"]
      interval: 2s
      timeout: 3s
      retries: 30
    depends_on:
      storefront:
        condition: service_healthy
      platform-api:
        condition: service_healthy
      cell-register:
        condition: service_completed_successfully

  # Enters the cell into the control plane's cell directory once its units are healthy, as the
  # cluster's PostSync hook does: role, capacity, and where its APIs answer, with its own token.
  # The capacity is far above the cluster's: this registry keeps every test run's shops (its volume
  # outlives `make dev-down`), and a full pool would refuse the next run's starter signups.
  cell-register:
    image: postgres:18-alpine
    environment:
      PLATFORM_CELL_TOKEN: ${PLATFORM_CELL_TOKEN:?run make secrets}
    entrypoint:
      - sh
      - -c
      - >-
        wget -qO- --header "content-type: application/json" --header "x-platform-token: $$PLATFORM_CELL_TOKEN"
        --post-data '{"role":"pooled","capacity":10000,"storefrontUrl":"http://storefront:3000","catalogUrl":"http://catalog-cart-api:4001","ordersUrl":"http://order-service:4002"}'
        http://platform-api:8101/internal/cells/pool-1/registration
    depends_on:
      storefront:
        condition: service_healthy
      platform-api:
        condition: service_healthy

  # The control plane: its own PostgreSQL, apart from the cell's, holding the tenant registry.
  platform-db:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PLATFORM_SUPERUSER_PASSWORD:?run make secrets}
      POSTGRES_DB: platform
    volumes:
      - platformdata:/var/lib/postgresql
    # Host access for tests that read the registry; loopback only.
    ports:
      - "127.0.0.1:55433:5432"
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "postgres", "-d", "platform"]
      interval: 2s
      timeout: 3s
      retries: 30

  platform-roles:
    image: postgres:18-alpine
    environment:
      PGHOST: platform-db
      PGUSER: postgres
      PGDATABASE: platform
      PGPASSWORD: ${DB_PLATFORM_SUPERUSER_PASSWORD}
      DB_PLATFORM_MIGRATOR_PASSWORD: ${DB_PLATFORM_MIGRATOR_PASSWORD:?run make secrets}
      DB_PLATFORM_APP_PASSWORD: ${DB_PLATFORM_APP_PASSWORD:?run make secrets}
    volumes:
      - ./db/platform/roles.sh:/roles.sh:ro
    entrypoint: ["sh", "/roles.sh"]
    depends_on:
      platform-db:
        condition: service_healthy

  migrate-platform:
    image: ghcr.io/amacneil/dbmate:2
    environment:
      DATABASE_URL: postgres://platform_migrator:${DB_PLATFORM_MIGRATOR_PASSWORD}@platform-db:5432/platform?sslmode=disable
      DBMATE_MIGRATIONS_DIR: /migrations
      DBMATE_MIGRATIONS_TABLE: platform.schema_migrations
      DBMATE_NO_DUMP_SCHEMA: "true"
    volumes:
      - ./db/platform/migrations:/migrations:ro
    command: ["--wait", "up"]
    depends_on:
      platform-roles:
        condition: service_completed_successfully

  # Enters the Phase 1 shops into the registry if they are missing; never undoes later changes.
  platform-seed:
    image: postgres:18-alpine
    environment:
      PGHOST: platform-db
      PGUSER: platform_migrator
      PGDATABASE: platform
      PGPASSWORD: ${DB_PLATFORM_MIGRATOR_PASSWORD}
      MERCHANT_CREDENTIALS: ${MERCHANT_CREDENTIALS:?run make secrets}
    volumes:
      - ./db/platform:/platform:ro
    entrypoint: ["sh", "/platform/seed.sh"]
    depends_on:
      migrate-platform:
        condition: service_completed_successfully

  platform-api:
    build:
      context: .
      dockerfile: apps/platform/Dockerfile
    environment:
      DATABASE_URL: postgres://platform_app:${DB_PLATFORM_APP_PASSWORD}@platform-db:5432/platform?sslmode=disable
      PLATFORM_ROUTER_TOKEN: ${PLATFORM_ROUTER_TOKEN:?run make secrets}
      PLATFORM_OPERATOR_TOKEN: ${PLATFORM_OPERATOR_TOKEN:?run make secrets}
      # Each cell's own tokens, one file per cell and key, as the cluster mounts them.
      CELL_CREDENTIALS_DIR: /run/cell-credentials
      TENANT_BASE_DOMAIN: shop.localhost
      APP_ENV: dev
    volumes:
      - ./.secrets/mounts/platform:/run/cell-credentials:ro
    ports:
      - "127.0.0.1:8101:8101" # internal listener, for tests; never on an ingress
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8101/health/ready"]
      interval: 2s
      timeout: 3s
      retries: 30
    depends_on:
      platform-seed:
        condition: service_completed_successfully

  # Runs lifecycle workflows (provisioning, deletion). No host port: its listener is
  # operational only, and the service can be scaled for the two-worker test.
  platform-worker:
    build:
      context: .
      dockerfile: apps/platform/Dockerfile
    command: ["node", "dist/worker-server.js"]
    environment:
      DATABASE_URL: postgres://platform_app:${DB_PLATFORM_APP_PASSWORD}@platform-db:5432/platform?sslmode=disable
      EDGE_URL: http://edge:8000
      TENANT_BASE_DOMAIN: shop.localhost
      # A deleted shop is purged through its cell's APIs (from the cell directory) with that cell's
      # token; a short grace between purge passes in dev.
      CELL_CREDENTIALS_DIR: /run/cell-credentials
      DELETE_GRACE_MS: "3000"
      # Per-tenant exports (Phase 6) to the worker's own volume. Daily here, not every 15 minutes:
      # the suites leave hundreds of shops, whose rounds would load the cell under the tests. The
      # scheduler looks every 2 s, so a new shop's first export is written at once.
      EXPORTS_DIR: /exports
      EXPORT_INTERVAL_MS: "86400000"
      EXPORT_SCHEDULE_MS: "2000"
      APP_ENV: dev
    volumes:
      - ./.secrets/mounts/platform:/run/cell-credentials:ro
      - tenantexports:/exports
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8102/health/ready"]
      interval: 2s
      timeout: 3s
      retries: 30
    depends_on:
      platform-seed:
        condition: service_completed_successfully

  # The promoter (Phase 4), for its tests only: they start it (profile `promoter`) against a stub of
  # the Kubernetes API (Argo CD's Applications), Prometheus, and GitHub that the test process serves
  # on the host. Its synthetic Checkouts are real, through the edge. Short ticks and soak for tests.
  platform-promoter:
    build:
      context: .
      dockerfile: apps/platform/Dockerfile
    profiles: ["promoter"]
    command: ["node", "dist/promoter-server.js"]
    environment:
      DATABASE_URL: postgres://platform_app:${DB_PLATFORM_APP_PASSWORD}@platform-db:5432/platform?sslmode=disable
      EDGE_URL: http://edge:8000
      TENANT_BASE_DOMAIN: shop.localhost
      KUBERNETES_API_URL: http://host.docker.internal:18199
      PROMETHEUS_URL: http://host.docker.internal:18199
      GITHUB_API_URL: http://host.docker.internal:18199
      GITHUB_REPOSITORY: test/shop
      GITHUB_PROMOTE_TOKEN: test-token
      RELEASE_IMAGE_PREFIX: ghcr.io/test/
      PROMOTER_TICK_MS: "500"
      SOAK_SECONDS: "4"
      SYNTHETIC_INTERVAL_MS: "2000"
      REDISPATCH_AFTER_SECONDS: "3600"
      APP_ENV: dev
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # Its metrics, for the tests; loopback only.
    ports:
      - "127.0.0.1:8103:8103"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8103/health/ready"]
      interval: 2s
      timeout: 3s
      retries: 30
    depends_on:
      platform-seed:
        condition: service_completed_successfully
      edge:
        condition: service_healthy

  # One-shot job run by `make seed` / `make dev-up`; a profile keeps `up --wait` from
  # treating its normal exit as a failure.
  seed:
    image: postgres:18-alpine
    profiles: ["jobs"]
    environment:
      PGHOST: postgres
      PGUSER: migrator
      PGDATABASE: shop
      PGPASSWORD: ${DB_MIGRATOR_PASSWORD}
    volumes:
      - ./db/seed:/seed:ro
    entrypoint: ["psql", "-v", "ON_ERROR_STOP=1", "-f", "/seed/catalog.sql"]
    depends_on:
      migrate-catalog:
        condition: service_completed_successfully

  # Traces (Phase 7): every unit sends OTLP over HTTP; tests read traces back on loopback.
  tempo:
    image: grafana/tempo@sha256:65a5789759435f1ef696f1953258b9bbdb18eb571d5ce711ff812d2e128288a4 # 2.9.0
    command: ["-config.file=/etc/tempo.yaml"]
    volumes:
      - ./deploy/compose/tempo.yaml:/etc/tempo.yaml:ro
    tmpfs:
      - /var/tempo:uid=10001,gid=10001
    ports:
      - "127.0.0.1:3200:3200"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3200/ready"]
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 20s

volumes:
  pgdata:
  redisdata:
  platformdata:
  tenantexports:
