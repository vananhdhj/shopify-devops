# Platform worker: lifecycle workflows (provisioning, deletion). It reaches the edge (to check a
# new shop like a buyer would) and the APIs of the shop's cell, from the cell directory, with that
# cell's own token (to purge a deleted shop).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: platform-worker
automountServiceAccountToken: false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: platform-worker
spec:
  replicas: 1
  # A new pod is ready before the old one stops: never fewer ready pods than replicas.
  strategy:
    rollingUpdate: { maxUnavailable: 0, maxSurge: 1 }
  selector:
    matchLabels:
      app.kubernetes.io/name: platform-worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: platform-worker
    spec:
      serviceAccountName: platform-worker
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000 # node in the image; numeric so the kubelet can verify non-root
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: platform-worker
          image: ghcr.io/vananhdhj/shopify-devops/platform
          command: ["node", "dist/worker-server.js"]
          env:
            - name: DB_PASSWORD
              valueFrom: { secretKeyRef: { name: platform-secrets, key: DB_PLATFORM_APP_PASSWORD } }
            - name: DATABASE_URL
              value: "postgres://platform_app:$(DB_PASSWORD)@platform-db:5432/platform?sslmode=disable"
            - name: CELL_CREDENTIALS_DIR
              value: /run/cell-credentials
          envFrom:
            - configMapRef:
                name: platform-env # the edge's address and the base domain, per environment
          ports:
            - name: ops
              containerPort: 8102
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          startupProbe:
            httpGet: { path: /health/live, port: ops }
            periodSeconds: 2
            failureThreshold: 60
            timeoutSeconds: 3
          livenessProbe:
            httpGet: { path: /health/live, port: ops }
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          readinessProbe:
            httpGet: { path: /health/ready, port: ops }
            periodSeconds: 5
            timeoutSeconds: 3
          resources:
            requests: { cpu: 25m, memory: 64Mi }
            limits: { memory: 192Mi }
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: cell-credentials
              mountPath: /run/cell-credentials
              readOnly: true
      volumes:
        - name: tmp
          emptyDir: {}
        # One file per cell and key, from `make secrets`; a cell added later appears in place.
        - name: cell-credentials
          secret:
            secretName: cell-credentials
