# The dev control plane on the laptop's k3d cluster, managing the one dev cell (shop-dev). CI
# rewrites the `digest:` lines below after each release build, as for the cell (ADR-0003).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: platform-dev
resources:
  - ../../base
configMapGenerator:
  - name: platform-env
    literals:
      - APP_ENV=dev
      - TENANT_BASE_DOMAIN=shop.localhost
      # The one cell this control plane manages (Phase 2): its router and its two APIs.
      - CELL_ROUTER_URL=http://router.shop-dev:8000
      - CELL_CATALOG_URL=http://catalog-cart-api.shop-dev:4001
      - CELL_ORDERS_URL=http://order-service.shop-dev:4002
images:
  - name: ghcr.io/vananhdhj/shopify-devops/platform
    digest: sha256:7c5f5d737885477b98646263fb9d9b7c9b381012441072bf8a3626e7fc561571
  - name: ghcr.io/vananhdhj/shopify-devops/db-migrations
    digest: sha256:114b262b7a36cd97c7235f65c565392ac7998761ee5c6bb80e5de2fe856953b6
