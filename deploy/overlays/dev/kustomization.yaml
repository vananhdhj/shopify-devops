# The dev environment on the laptop's k3d cluster. CI rewrites the `digest:` lines below after
# each release build (ADR-0003); everything else changes only through pull requests.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: shop-dev
resources:
  - ../../base
  - seed-job.yaml
configMapGenerator:
  - name: shop-env
    literals:
      - APP_ENV=dev
      - COOKIE_SECURE=false # plain http on the lab ingress
      - TENANT_BASE_DOMAIN=shop.localhost
      # The control plane this cell belongs to: the routing table, sign-ins, and signup pages.
      - PLATFORM_API_URL=http://platform-api.platform-dev:8101
      - PLATFORM_PUBLIC_URL=http://platform-api.platform-dev:8100
patches:
  - target: {kind: Ingress, name: router}
    patch: |-
      - op: replace
        path: /spec/rules/0/host
        value: "*.shop.localhost"
      - op: replace
        path: /spec/rules/1/host
        value: shop.localhost
images:
  - name: ghcr.io/vananhdhj/shopify-devops/catalog-cart-api
