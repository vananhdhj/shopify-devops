apiVersion: apps/v1
kind: Deployment
metadata:
  name: unknown-registry
spec:
  selector: { matchLabels: { app: unknown-registry } }
  template:
    metadata: { labels: { app: unknown-registry } }
    spec:
      securityContext: { runAsNonRoot: true, runAsUser: 1000 }
      containers:
        - name: app
          image: docker.io/someone/tool@sha256:1111111111111111111111111111111111111111111111111111111111111111
          securityContext: { allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: { drop: ["ALL"] } }
          resources: { requests: { cpu: 10m, memory: 32Mi }, limits: { memory: 64Mi } }
