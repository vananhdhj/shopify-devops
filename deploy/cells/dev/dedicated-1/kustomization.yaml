# Cell dedicated-1 of the dev environment: one plus shop alone, placed at signup when the cell is
# free. No seed data: its Merchant builds the catalog. CI rewrites the `digest:` lines below
# after each release build (ADR-0003).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: cell-dedicated-1-dev
# Every pod names its cell; the PodMonitors copy it into a `cell` label on every series (Phase 5).
# Patched into the pod templates only: kustomize's `labels` would also reach a StatefulSet's
# volume claim templates, which cannot change, and every sync of the cell would fail.
patches:
  - target: {kind: Deployment}
    patch: |-
      - op: add
        path: /spec/template/metadata/labels/shop.example~1cell
        value: dedicated-1
  - target: {kind: StatefulSet}
    patch: |-
      - op: add
        path: /spec/template/metadata/labels/shop.example~1cell
        value: dedicated-1
resources:
  - ../../../base
  # Secrets, sealed for Git (Phase 7): `make secrets` writes them; the controller decrypts them.
  - sealed-shop-secrets.yaml
configMapGenerator:
  - name: shop-env
    literals:
      - APP_ENV=dev
      - COOKIE_SECURE=false # plain http on the lab ingress
      - TENANT_BASE_DOMAIN=shop.localhost
      # This cell in its control plane's cell directory (registered by the register-cell hook).
      - CELL_ID=dedicated-1
      # Traces (Phase 7): OTLP to Alloy, each span naming this cell.
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://alloy.monitoring.svc:4318
      - OTEL_RESOURCE_ATTRIBUTES=cell=dedicated-1
      - CELL_ROLE=dedicated
      - CELL_CAPACITY=1
      # The control plane this cell belongs to: the routing table, sign-ins, and signup pages.
      - PLATFORM_API_URL=http://platform-api.platform-dev:8101
      - PLATFORM_PUBLIC_URL=http://platform-api.platform-dev:8100
images:
  - name: ghcr.io/vananhdhj/shopify-devops/catalog-cart-api
