# Loki for the laptop lab (Phase 7, decision 1): one single-binary pod, filesystem storage on a
# PVC, 24 h retention, no caches, gateway, or canary. Chart version pinned in application.yaml.
deploymentMode: SingleBinary

loki:
  # Pinned by digest (the manifest policies, ticket 01): 3.6.11, multi-arch.
  image:
    tag: 3.6.11
    digest: sha256:44148ad243c07957113baea950ee5ba9b0c8eff8d7e38ff3cc1c0af705790945
  auth_enabled: false
  commonConfig:
    replication_factor: 1
  storage:
    type: filesystem
  schemaConfig:
    configs:
      - from: "2026-10-01"
        store: tsdb
        object_store: filesystem
        schema: v13
        index:
          prefix: index_
          period: 24h
  limits_config:
    retention_period: 24h
    # Bounded labels (namespace, cell, app); everything else stays in the JSON line.
    max_label_names_per_series: 8
    ingestion_rate_mb: 4
    ingestion_burst_size_mb: 8
  compactor:
    retention_enabled: true
    delete_request_store: filesystem
  # Query-side JSON parsing is the only way into tenant_id, requestId, and traceId.
  pattern_ingester:
    enabled: false
  ui:
    enabled: false

singleBinary:
  replicas: 1
  persistence:
    enabled: true
    size: 2Gi
  resources:
    requests: { cpu: 50m, memory: 128Mi }
    limits: { memory: 256Mi }
  extraEnv:
    # Keep Go's heap under the container's limit.
    - name: GOMEMLIMIT
      value: 200MiB

# The scalable modes' components, unused in single-binary mode.
backend: { replicas: 0 }
read: { replicas: 0 }
write: { replicas: 0 }
ingester: { replicas: 0 }
querier: { replicas: 0 }
queryFrontend: { replicas: 0 }
queryScheduler: { replicas: 0 }
distributor: { replicas: 0 }
compactor: { replicas: 0 }
indexGateway: { replicas: 0 }
bloomCompactor: { replicas: 0 }
bloomGateway: { replicas: 0 }

gateway: { enabled: false }
chunksCache: { enabled: false }
resultsCache: { enabled: false }
lokiCanary: { enabled: false }
test: { enabled: false }
memberlist:
  service:
    publishNotReadyAddresses: true

sidecar:
  rules:
    enabled: false
