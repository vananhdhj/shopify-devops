# The dev control plane on the laptop's k3d cluster, managing the dev cells. CI
# rewrites the `digest:` lines below after each release build, as for the cell (ADR-0003).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: platform-dev
resources:
  - ../../base
configMapGenerator:
  - name: platform-env
    literals:
      - APP_ENV=dev
      - TENANT_BASE_DOMAIN=shop.localhost
      # Where a new shop is checked like a buyer would; each cell's APIs come from the cell directory.
      - EDGE_URL=http://edge.edge-dev:8000
      # The same, for a platform image older than EDGE_URL (between the merge and the digest
      # commit); remove once that image is gone.
      - CELL_ROUTER_URL=http://edge.edge-dev:8000
images:
  - name: ghcr.io/vananhdhj/shopify-devops/platform
    digest: sha256:0bf5d5b0757a1de7a8ebbd7d19e415f0232bdde60415ca5f8691877aebe98c55
  - name: ghcr.io/vananhdhj/shopify-devops/db-migrations
    digest: sha256:7b61fb8ada694f9ad89981834975c30faccfcabbcf539b2aead066c90ad59cea
