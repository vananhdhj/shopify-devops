name: release

# On main: build each affected service image once, push it to GHCR, and record its digest.
# Deploy-only commits (the digest bump of ADR-0003, ticket 08) never rebuild anything.
on:
  push:
    branches: [main]
    paths-ignore:
      - "deploy/**"
  workflow_dispatch:
    inputs:
      all:
        description: Build and publish every service image
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      services: ${{ steps.affected.outputs.services }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: filter
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          filters: .github/path-filters.yml
      - id: affected
        run: .github/scripts/affected-services.sh '${{ steps.filter.outputs.changes }}' '${{ github.event_name == 'workflow_dispatch' && inputs.all }}'

  # One native build per service and architecture, pushed by digest only (no tag yet).
  build:
    needs: changes
    if: needs.changes.outputs.services != '[]'
    runs-on: ${{ matrix.platform.runner }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJSON(needs.changes.outputs.services) }}
        platform:
          - { arch: amd64, runner: ubuntu-latest }
          - { arch: arm64, runner: ubuntu-24.04-arm } # the M2 laptop's k3d cluster runs arm64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: apps/${{ matrix.service }}/Dockerfile
          platforms: linux/${{ matrix.platform.arch }}
          labels: org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          outputs: type=image,name=ghcr.io/${{ github.repository }}/${{ matrix.service }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ matrix.service }}-${{ matrix.platform.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}-${{ matrix.platform.arch }}
      - name: Keep the platform digest for the merge job
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p platform-digests
          echo "$DIGEST" >"platform-digests/${{ matrix.platform.arch }}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: platform-digest-${{ matrix.service }}-${{ matrix.platform.arch }}
          path: platform-digests/${{ matrix.platform.arch }}

  # One multi-architecture image per service: both platform digests under a single index
  # digest, tagged with the commit. That index digest is what deployments reference.
  merge:
    needs: [changes, build]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJSON(needs.changes.outputs.services) }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: platform-digest-${{ matrix.service }}-*
          merge-multiple: true
          path: platform-digests
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Create the multi-arch image and record its digest
        env:
          IMAGE: ghcr.io/${{ github.repository }}/${{ matrix.service }}
          SERVICE: ${{ matrix.service }}
        run: |
          sources=()
          for arch in amd64 arm64; do sources+=("${IMAGE}@$(cat "platform-digests/${arch}")"); done
          docker buildx imagetools create --tag "${IMAGE}:sha-${GITHUB_SHA}" "${sources[@]}"
          digest="$(docker buildx imagetools inspect "${IMAGE}:sha-${GITHUB_SHA}" --format '{{json .Manifest}}' | jq -r .digest)"
          mkdir -p digests
          jq -n --arg service "$SERVICE" --arg image "$IMAGE" --arg digest "$digest" --arg commit "$GITHUB_SHA" \
            '{service: $service, image: $image, digest: $digest, ref: "\($image)@\($digest)", commit: $commit, platforms: ["linux/amd64", "linux/arm64"]}' \
            >"digests/${SERVICE}.json"
          cat "digests/${SERVICE}.json"
          echo "### ${SERVICE}: \`${IMAGE}@${digest}\` (amd64 + arm64)" >>"$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: digest-${{ matrix.service }}
          path: digests/${{ matrix.service }}.json
