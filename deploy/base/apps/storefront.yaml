# Storefront: serves every shop of the cell, behind the edge; only the edge reaches it.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: storefront
automountServiceAccountToken: false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: storefront
spec:
  replicas: 1
  # A new pod is ready before the old one stops: never fewer ready pods than replicas.
  strategy:
    rollingUpdate: { maxUnavailable: 0, maxSurge: 1 }
  selector:
    matchLabels:
      app.kubernetes.io/name: storefront
  template:
    metadata:
      labels:
        app.kubernetes.io/name: storefront
    spec:
      serviceAccountName: storefront
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000 # node in the image; numeric so the kubelet can verify non-root
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: storefront
          image: ghcr.io/vananhdhj/shopify-devops/storefront
          env:
            - name: CATALOG_API_URL
              value: http://catalog-cart-api:4001
            - name: ORDER_SERVICE_URL
              value: http://order-service:4002
            - name: ADMIN_SERVICE_TOKEN
              valueFrom: { secretKeyRef: { name: shop-secrets, key: ADMIN_SERVICE_TOKEN } }
            - name: SESSION_SECRET
              valueFrom: { secretKeyRef: { name: shop-secrets, key: SESSION_SECRET } }
            - name: TENANT_CONTEXT_SECRET
              valueFrom: { secretKeyRef: { name: shop-secrets, key: TENANT_CONTEXT_SECRET } }
            # Set only during a rotation of the cell's tenant-context secret (Phase 7).
            - name: TENANT_CONTEXT_SECRET_NEXT
              valueFrom: { secretKeyRef: { name: shop-secrets, key: TENANT_CONTEXT_SECRET_NEXT, optional: true } }
            # Merchant sign-in is checked by the control plane (PLATFORM_API_URL from shop-env).
            - name: PLATFORM_STOREFRONT_TOKEN
              valueFrom: { secretKeyRef: { name: shop-secrets, key: PLATFORM_STOREFRONT_TOKEN } }
          envFrom:
            - configMapRef:
                name: shop-env # generated per environment by the overlay
          ports:
            - name: http
              containerPort: 3000
            - name: metrics # private: not behind the Service or the ingress
              containerPort: 9464
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          # Kept serving for 5 s after the pod starts terminating, while the Service's endpoints and
          # Traefik drop it; only then SIGTERM starts the drain. Without it a rollout fails requests.
          lifecycle:
            preStop:
              sleep: { seconds: 5 }
          startupProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 2
            failureThreshold: 60
            timeoutSeconds: 3
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          readinessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 5
            timeoutSeconds: 3
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits: { memory: 384Mi }
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: next-cache
              mountPath: /app/apps/storefront/.next/cache
      volumes:
        - name: tmp
          emptyDir: {}
        - name: next-cache
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: storefront
spec:
  selector:
    app.kubernetes.io/name: storefront
  ports:
    - name: http
      port: 3000
      targetPort: http
