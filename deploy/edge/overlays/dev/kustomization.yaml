# The dev edge on the laptop's k3d cluster. Until the ingress moves to it (Phase 3 ticket 03) it
# runs beside each cell's router and carries no buyer traffic: reach it with a port-forward and a
# shop's Host header. CI rewrites the `digest:` line below after each release build (ADR-0003).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: edge-dev
resources:
  - ../../base
configMapGenerator:
  - name: edge-env
    literals:
      - APP_ENV=dev
      - TENANT_BASE_DOMAIN=shop.localhost
      # The control plane: the routing table (with the cell directory) and the signup pages.
      - PLATFORM_API_URL=http://platform-api.platform-dev:8101
      - PLATFORM_PUBLIC_URL=http://platform-api.platform-dev:8100
images:
  - name: ghcr.io/vananhdhj/shopify-devops/router
    digest: sha256:d6fedd555531ea9c90bafbb183f2f73b148200b96f4ca5fa83d81a177bdd48f6
